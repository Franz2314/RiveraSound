<!-- Cuenta de usuario -->

<!-- Encabezado de página -->
<div class="page-header">
  <h1>Mi Cuenta</h1>
  <p>Accede a tu panel personal de RiveraSound</p>
</div>

<!-- Sección de panel de cuenta -->
<section>
  <div class="contenedor">
    <!-- Pestañas de navegación entre paneles: Login, Registro, Perfil, Pedidos -->
    <!-- Perfil y Pedidos se ocultan/muestran por JS según estado de sesión -->
    <div id="cuentaTabs" style="display:flex;gap:12px;justify-content:center;margin-bottom:32px;flex-wrap:wrap;">
      <button class="cuenta-tab btn-filtro activo" data-tab="login">Iniciar Sesión</button>
      <button class="cuenta-tab btn-filtro" data-tab="registro">Registrarse</button>
      <button class="cuenta-tab btn-filtro cuenta-tab-sesion" data-tab="perfil" style="display:none;">Mi Perfil</button>
      <button class="cuenta-tab btn-filtro cuenta-tab-sesion" data-tab="pedidos" style="display:none;">Mis Pedidos</button>
    </div>

    <div id="cuentaPanels">
      <!-- Panel: iniciar sesión -->
      <div class="cuenta-panel activo" id="cuentaPanelLogin">
        <div class="form-contenedor" style="max-width:440px;">
          <form id="formLogin" novalidate>
            <!-- Input de correo electrónico con validación: required, type=email -->
            <div class="form-grupo">
              <label for="loginCorreo">Correo electrónico</label>
              <input type="email" id="loginCorreo" name="correo" placeholder="tu@correo.com" required>
              <span class="error-msg"></span>
            </div>
            <!-- Input de contraseña con validación: required, minlength=6 -->
            <div class="form-grupo">
              <label for="loginPassword">Contraseña</label>
              <input type="password" id="loginPassword" name="password" placeholder="Tu contraseña" required minlength="6">
              <span class="error-msg"></span>
            </div>
            <button type="submit" class="btn btn-primario" style="width:100%;">Iniciar sesión</button>
          </form>
          <!-- Enlace para cambiar al panel de registro -->
          <div class="cuenta-enlace">
            <a href="#cuenta-registro">¿No tienes cuenta? Regístrate</a>
          </div>
        </div>
      </div>

      <!-- Panel: registrarse -->
      <div class="cuenta-panel" id="cuentaPanelRegistro">
        <div class="form-contenedor" style="max-width:440px;">
          <form id="formRegistro" novalidate>
            <!-- Input de nombre: required, minlength=2 -->
            <div class="form-grupo">
              <label for="regNombre">Nombre</label>
              <input type="text" id="regNombre" name="nombre" placeholder="Tu nombre" required minlength="2">
              <span class="error-msg"></span>
            </div>
            <!-- Input de apellido: required, minlength=2 -->
            <div class="form-grupo">
              <label for="regApellido">Apellido</label>
              <input type="text" id="regApellido" name="apellido" placeholder="Tu apellido" required minlength="2">
              <span class="error-msg"></span>
            </div>
            <!-- Input de correo: required, type=email -->
            <div class="form-grupo">
              <label for="regCorreo">Correo electrónico</label>
              <input type="email" id="regCorreo" name="correo" placeholder="tu@correo.com" required>
              <span class="error-msg"></span>
            </div>
            <!-- Input de contraseña: required, minlength=6 -->
            <div class="form-grupo">
              <label for="regPassword">Contraseña</label>
              <input type="password" id="regPassword" name="password" placeholder="Mínimo 6 caracteres" required minlength="6">
              <span class="error-msg"></span>
            </div>
            <button type="submit" class="btn btn-primario" style="width:100%;">Crear cuenta</button>
          </form>
          <!-- Enlace para cambiar al panel de login -->
          <div class="cuenta-enlace">
            <a href="#cuenta-login">¿Ya tienes cuenta? Inicia sesión</a>
          </div>
        </div>
      </div>

      <!-- Panel: mi perfil -->
      <div class="cuenta-panel" id="cuentaPanelPerfil">
        <div class="form-contenedor" style="max-width:440px;">
          <div style="text-align:center;margin-bottom:20px;">
            <div style="font-size:4rem;margin-bottom:8px;">👤</div>
            <h3 style="color:var(--page-acento, var(--color-principal));">Inicia sesión</h3>
            <p style="color:var(--color-gris);">---</p>
          </div>
          <a href="#cuenta-pedidos" class="btn btn-secundario" style="width:100%;text-align:center;margin-bottom:10px;">Ver mis pedidos</a>
          
          <form id="formPerfilDatos" novalidate style="border-top: 1px solid rgba(255,255,255,0.1); margin-top: 15px; padding-top: 15px; text-align: left;">
            <h4 style="margin-bottom: 12px; color: var(--color-acento);">Datos de Envío</h4>
            <div class="form-grupo" style="margin-bottom: 12px;">
              <label for="perfilTelefono" style="font-size: 0.85rem; font-weight: bold; display: block; margin-bottom: 4px;">Teléfono de contacto</label>
              <input type="tel" id="perfilTelefono" name="perfilTelefono" placeholder="987654321" pattern="[0-9]{9}" maxlength="9" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.15); font-size: 0.9rem; background:var(--color-principal); color:var(--color-texto);">
              <span class="error-msg" style="font-size: 0.75rem; color: var(--color-error); display: block; margin-top: 2px;"></span>
            </div>
            <div class="form-grupo" style="margin-bottom: 12px;">
              <label for="perfilDireccion" style="font-size: 0.85rem; font-weight: bold; display: block; margin-bottom: 4px;">Dirección de despacho</label>
              <input type="text" id="perfilDireccion" name="perfilDireccion" placeholder="Av. Larco 123" minlength="5" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.15); font-size: 0.9rem; background:var(--color-principal); color:var(--color-texto);">
              <span class="error-msg" style="font-size: 0.75rem; color: var(--color-error); display: block; margin-top: 2px;"></span>
            </div>
            <div class="form-grupo" style="margin-bottom: 15px;">
              <label for="perfilCiudad" style="font-size: 0.85rem; font-weight: bold; display: block; margin-bottom: 4px;">Ciudad</label>
              <input type="text" id="perfilCiudad" name="perfilCiudad" placeholder="Lima" minlength="3" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.15); font-size: 0.9rem; background:var(--color-principal); color:var(--color-texto);">
              <span class="error-msg" style="font-size: 0.75rem; color: var(--color-error); display: block; margin-top: 2px;"></span>
            </div>
            <button type="submit" class="btn btn-primario" style="width: 100%; padding: 8px; font-size: 0.9rem; margin-bottom: 10px;">Guardar datos</button>
          </form>

          <button id="btnCerrarSesion" class="btn btn-secundario" style="width:100%;text-align:center;border-color:var(--color-error);color:var(--color-error);display:none;">Cerrar sesión</button>
        </div>
      </div>

      <!-- Panel: mis pedidos -->
      <!-- Estado vacío mostrado cuando no hay pedidos registrados -->
      <div class="cuenta-panel" id="cuentaPanelPedidos">
        <div style="text-align:center;padding:40px 0;">
          <div style="font-size:3rem;opacity:0.3;margin-bottom:12px;">📦</div>
          <h3 style="color:var(--color-principal);">No tienes pedidos aún</h3>
          <p style="color:var(--color-gris);">Los pedidos que realices aparecerán aquí.</p>
          <a href="#instrumentos" class="btn btn-primario" style="margin-top:12px;">Explorar catálogo</a>
        </div>
      </div>
    </div>
  </div>
</section>
