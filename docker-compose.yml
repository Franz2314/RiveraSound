name: riverasound

services:

  # =============================================
  # PostgreSQL — Datos transaccionales
  # =============================================
  postgres:
    image: postgres:16-alpine
    container_name: riverasound-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: riverasound
      POSTGRES_USER: rivera_user
      POSTGRES_PASSWORD: rivera_pass_2026
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/models/postgres/esquema.sql:/docker-entrypoint-initdb.d/01-esquema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivera_user -d riverasound"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - riverasound-net

  # =============================================
  # MongoDB — Documentos (blog, reseñas, catálogo)
  # =============================================
  mongo:
    image: mongo:7
    container_name: riverasound-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: riverasound
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - riverasound-net

  # =============================================
  # Cassandra — Alta escritura (logs, sesiones)
  # =============================================
  cassandra:
    image: cassandra:5
    container_name: riverasound-cassandra
    hostname: cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: 'RiveraSound Cluster'
      CASSANDRA_DC: 'dc1'
      CASSANDRA_RACK: 'rack1'
      CASSANDRA_ENDPOINT_SNITCH: SimpleSnitch
      CASSANDRA_NUM_TOKENS: 128
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./backend/models/cassandra/inicializacion.cql:/docker-entrypoint-initdb.d/init.cql
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q UN"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 40s
    networks:
      - riverasound-net

  # =============================================
  # App — Node.js (Express)
  # =============================================
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: riverasound-app
    restart: unless-stopped
    environment:
      PORT: 3000
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: riverasound
      PG_USER: rivera_user
      PG_PASSWORD: rivera_pass_2026
      MONGO_URI: mongodb://root:example@mongo:27017/riverasound?authSource=admin
      CASSANDRA_CONTACT_POINTS: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_DATACENTER: dc1
      CASSANDRA_KEYSPACE: riverasound
      JWT_SECRET: riverasound_jwt_secret_key_2026
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: '*'
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    networks:
      - riverasound-net

volumes:
  postgres_data:
    name: riverasound_postgres_data
  mongo_data:
    name: riverasound_mongo_data
  cassandra_data:
    name: riverasound_cassandra_data

networks:
  riverasound-net:
    name: riverasound-network
    driver: bridge
